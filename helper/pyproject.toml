[project]
name = "skeleton-coast-growth-dashboard-helper"
version = "0.1.0"
description = "Windows helper for Skeleton Coast Growth Dashboard"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.36.0",
]

[project.scripts]
skeleton-coast-helper = "skeleton_helper.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
